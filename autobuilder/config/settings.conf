#!/usr/bin/env bash
# AutoBuilder configuration

CLAUDE_CMD="claude"
OUTPUT_BASE_DIR="$(cd "$(dirname "${BASH_SOURCE[0]}")/../.." && pwd)/output"
LOG_DIR="${HOME}/.autobuilder/logs"
STAGE_TIMEOUT=600

# Agent run mode
AGENT_OUTPUT_FLAGS="-p"
AGENT_BUILD_FLAGS="--dangerously-skip-permissions -p"

# Pipeline settings
MAX_RETRIES=2
VERBOSE=${VERBOSE:-0}
