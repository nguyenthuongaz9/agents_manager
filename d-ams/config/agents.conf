#===============================================================================
# Agent Configuration - D-AMS
# Define your 3 terminal AI agents: Claude Code, Gemini, OpenCode
#===============================================================================

# ---- Agent Definitions ----
# Format: AGENT_<NAME>_<PROPERTY>

# --- Claude Code ---
AGENT_CLAUDE_NAME="Claude Code"
AGENT_CLAUDE_COMMAND="claude"
AGENT_CLAUDE_DESC="Anthropic's AI coding agent - best for complex coding tasks"
AGENT_CLAUDE_ICON="🟣"
AGENT_CLAUDE_ROLE="Backend Developer / Systems Programmer"

# --- Gemini ---
AGENT_GEMINI_NAME="Gemini"
AGENT_GEMINI_COMMAND="gemini"
AGENT_GEMINI_DESC="Google's AI assistant - best for research, planning, architecture"
AGENT_GEMINI_ICON="🔵"
AGENT_GEMINI_ROLE="Leader Agent / Tech Lead"

# --- OpenCode ---
AGENT_OPENCODE_NAME="OpenCode"
AGENT_OPENCODE_COMMAND="opencode"
AGENT_OPENCODE_DESC="Open-source coding agent - best for file operations, refactoring"
AGENT_OPENCODE_ICON="🟢"
AGENT_OPENCODE_ROLE="QA/QC Engineer / Frontend Developer"

# ---- Agent Registry (list all agent keys) ----
AGENTS_LIST=("CLAUDE" "GEMINI" "OPENCODE")

# ---- Default Leader ----
DEFAULT_LEADER="GEMINI"

# ---- Kitty Terminal Settings ----
KITTY_SESSION_DIR="$HOME/.config/kitty/sessions"
KITTY_REMOTE="${KITTY_REMOTE:-unix}"

# ---- Session Storage ----
SESSION_DIR="${SESSION_DIR:-./sessions}"

# ---- Token / Rate-limit Auto-retry ----
# How many seconds to wait before retrying an agent that hit a token/rate limit
# Default: 3600 (1 hour). Set lower (e.g. 300) for API rate limits that clear faster.
TOKEN_RETRY_WAIT="${TOKEN_RETRY_WAIT:-3600}"

# ---- D-AMS Workflow Phases ----
PHASES=(
  "1: Intake & Analysis"
  "2: Team Assembly"
  "3: Planning & Tasking"
  "4: Execution & Domain Review"
  "5: Domain-Specific QA"
  "6: Delivery"
)
