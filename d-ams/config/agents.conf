AGENTS_LIST=("LEADER" "BACKEND" "FRONTEND" "DBA" "MOBILE" "ML" "DATA" "DEVOPS" "SECURITY" "QA")

# ---- Default Leader ----
DEFAULT_LEADER="LEADER"

# ---- Kitty Terminal Settings ----
KITTY_SESSION_DIR="$HOME/.config/kitty/sessions"
KITTY_REMOTE="${KITTY_REMOTE:-unix}"

# ---- Session Storage ----
SESSION_DIR="${SESSION_DIR:-./sessions}"

# ---- Token / Rate-limit Auto-retry ----
# Seconds to wait before retrying an agent that hit a token/rate limit.
# Default: 3600 (1 hour). Set lower (e.g. 300) for API-tier limits.
TOKEN_RETRY_WAIT="${TOKEN_RETRY_WAIT:-3600}"

# ---- D-AMS Workflow Phases ----
PHASES=(
  "1: Intake & Analysis"
  "2: Team Assembly"
  "3: Planning & Tasking"
  "4: Execution & Domain Review"
  "5: Domain-Specific QA"
  "6: Delivery"
)
